plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
version = '0.1.0'
group = 'dev.preston'
repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.2:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.18.2'
    modImplementation 'meteordevelopment:meteor-client:1.21.11-SNAPSHOT'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
