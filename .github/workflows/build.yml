name: Build
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build addon
        working-directory: spear-burst-1.21.11-source
        run: gradle build --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m'
      - uses: actions/upload-artifact@v4
        with:
          name: spear-burst-1.21.11
          path: spear-burst-1.21.11-source/build/libs/spear-burst-0.1.0.jar
          if-no-files-found: error
